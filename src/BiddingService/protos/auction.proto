syntax="proto3";

option csharp_namespace = "AuctionService.Protos";

service GrpcAuction {
  rpc GetAuction (GetAuctionRequest) returns (GrpcAuctionModel);
}

message GetAuctionRequest {
  string id = 1;
}

message GrpcAuctionModel {
  string id = 1;
  string seller = 2;
  string auctionEnd = 3;
  int32 reservePrice = 4;
}
